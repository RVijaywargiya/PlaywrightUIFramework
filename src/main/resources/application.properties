# ==============================================================================
# Environment Configuration
# ==============================================================================
# Options: dev, qa, staging, prod
env=qa

# Application URLs
url.dev=https://orangehrmlive.com
url.qa=https://orangehrmlive.com
url.staging=https://orangehrmlive.com

# ==============================================================================
# Browser & Execution Settings
# ==============================================================================
# Options: chromium, firefox, webkit
browser=chromium

# Options: true (run without UI), false (show browser window)
headless=false

# Channel variations if targeting local machine browsers (optional)
# Options: chrome, msedge (leave blank to use Playwright's bundled binaries)
browser.channel=

# Slow down execution speed by specified milliseconds (0 for normal speed)
slow.mo=0

# ==============================================================================
# Framework Timeouts (in milliseconds)
# ==============================================================================
# Maximum time for a page to load completely (30 seconds)
timeout.page.load=30000

# Maximum time for element interactions like click(), fill() (15 seconds)
timeout.element.action=15000

# ==============================================================================
# Artifacts & Reporting Flags
# ==============================================================================
# Options: true, false
screenshot.on.failure=true
video.record.enabled=false

# Options: off, on, retain-on-failure
trace.viewer.mode=retain-on-failure
